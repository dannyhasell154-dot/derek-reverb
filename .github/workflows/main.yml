name: Build Derek Reverb

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: DerekReverb-Windows
          path: build/DerekReverb_artefacts/Release/VST3/
